<title>未来面试间</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Silkscreen&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: one working screen. The pixel stage leads, the casting desk sits under it, and a log rail runs down the right; everything stacks on phones. */
:root{
  --bg:#E9EDF2; --panel:#FFFFFF; --sunk:#F3F5F8; --ink:#1A2232; --muted:#566074; --line:#D3D9E2;
  --pen:#2B57CF; --pen-ink:#FFFFFF; --folder:#E4BA55; --folder-ink:#3A2C08;
  --glow:#0E97AB; --good:#24864E; --bad:#C23B4B;
  --hr:#8447BD; --biz:#2B57CF; --cand:#B4600F; --narr:#566074;
  --paper:#FFFDF7; --paper-ink:#1A2232; --paper-edge:#1A2232; --ai-paper:#E6FAFD; --ai-edge:#0B8597;
  --display:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --pixel:"Silkscreen",ui-monospace,Menlo,Consolas,monospace;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141D; --panel:#171E2B; --sunk:#121824; --ink:#E6EBF3; --muted:#9AA5B8; --line:#283246;
  --pen:#7C9DFF; --pen-ink:#0E1424; --folder:#E4BA55; --folder-ink:#2A1F05;
  --glow:#3ED3E8; --good:#55C485; --bad:#F06A7A;
  --hr:#C49AF0; --biz:#8EAEFF; --cand:#F0A55C; --narr:#9AA5B8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141D; --panel:#171E2B; --sunk:#121824; --ink:#E6EBF3; --muted:#9AA5B8; --line:#283246;
  --pen:#7C9DFF; --pen-ink:#0E1424; --folder:#E4BA55; --folder-ink:#2A1F05;
  --glow:#3ED3E8; --good:#55C485; --bad:#F06A7A;
  --hr:#C49AF0; --biz:#8EAEFF; --cand:#F0A55C; --narr:#9AA5B8; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.top{max-width:1380px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.brand{min-width:0}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.05;letter-spacing:.05em;margin:0;text-wrap:balance}
.brand h1 small{font-family:var(--pixel);font-size:.36em;letter-spacing:.08em;color:var(--pen);vertical-align:.55em;margin-left:.5em}
.brand p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.mode{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pen);color:var(--pen-ink)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.mode .hint{font-size:12px;color:var(--muted);text-align:right;max-width:42ch}
.app{max-width:1380px;margin:0 auto;display:grid;gap:16px;align-items:start;
  grid-template-columns:minmax(0,1fr) minmax(300px,370px);grid-template-areas:"theater rail" "casting rail"}
.theater{grid-area:theater;min-width:0;display:flex;flex-direction:column;gap:10px}
.rail{grid-area:rail;min-width:0;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
.casting{grid-area:casting;min-width:0}
@media (max-width:1000px){.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"theater" "rail" "casting"}.rail{position:static}}

/* stage */
.stage-wrap{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#1A2030;
  box-shadow:0 0 0 1px var(--line),0 10px 30px -18px rgba(10,20,40,.55);container-type:inline-size;container-name:stage}
#stage{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{position:absolute;inset:0;pointer-events:none;font-size:clamp(10px,1.72cqw,15px);font-family:var(--body)}
.bubble{position:absolute;max-width:44%;width:max-content;background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-edge);
  border-radius:6px;padding:.32em .62em;line-height:1.45;box-shadow:3px 3px 0 rgba(20,28,44,.35);transform:translate(var(--tx,-20%),calc(-100% - 6px));
  opacity:0;transition:opacity .12s}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;bottom:-7px;left:var(--tail,20%);width:10px;height:10px;background:var(--paper);border-right:2px solid var(--paper-edge);border-bottom:2px solid var(--paper-edge);transform:rotate(45deg) translateX(-50%);}
.bubble .who{display:block;font-size:.78em;font-weight:700;letter-spacing:.04em;opacity:.7}
.bubble.ai{background:var(--ai-paper);border-color:var(--ai-edge);font-family:var(--mono);font-size:.86em}
.bubble.ai::after{background:var(--ai-paper);border-color:var(--ai-edge)}
.bubble.below{transform:translate(var(--tx,-50%),8px)}
.bubble.below::after{bottom:auto;top:-7px;transform:rotate(225deg) translateX(50%)}
.bubble.ai .who{color:var(--ai-edge);opacity:1}
.bubble.thought{border-style:dashed;border-radius:14px}
.bubble.thought::after{border-radius:50%;width:8px;height:8px;bottom:-12px;border:2px dashed var(--paper-edge)}
.bubble .score{font-family:var(--pixel);font-size:1em;margin-left:.4em}
.caption{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);max-width:78%;width:max-content;background:rgba(14,18,28,.86);color:#F4F0E4;
  padding:.35em .9em;border-radius:4px;font-size:.95em;line-height:1.45;opacity:0;transition:opacity .2s;text-align:center}
.caption.on{opacity:1}
.caption b{color:#F2C55C;font-weight:700;margin-right:.4em}
.wb{position:absolute;left:68.1%;top:8.9%;width:25%;height:22.2%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.1em;text-align:center;color:#22314C;line-height:1.2}
.wb .code{font-family:var(--pixel);font-size:1.15em;color:#2B57CF}
.wb .name{font-weight:700;font-size:.9em}
.wb .step{font-size:.72em;color:#4A5873}
.poster{position:absolute;left:9.4%;top:12.2%;width:15%;height:16.7%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFF7E0;font-size:.7em;line-height:1.15;text-align:center}
.poster b{font-family:var(--pixel);font-size:1.25em;color:#FFE08A}
.skip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:2.4em;color:#FFF3D6;
  text-shadow:0 2px 0 rgba(0,0,0,.4);background:rgba(10,14,24,.35);opacity:0;transition:opacity .25s}
.skip.on{opacity:1}
.hire{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);pointer-events:auto;background:var(--paper);color:var(--paper-ink);border:3px solid var(--paper-edge);
  border-radius:8px;padding:.8em 1.1em;box-shadow:5px 5px 0 rgba(20,28,44,.4);display:flex;gap:.9em;align-items:center;max-width:78%}
.hire canvas{width:4.2em;height:auto;image-rendering:pixelated;flex:none}
.hire .stamp{font-family:var(--display);font-size:1.6em;color:#C23B4B;line-height:1}
.hire .nm{font-weight:700;font-size:1.15em}
.hire .rs{font-size:.85em;color:#4A5873;margin-top:.2em}
.start-hint{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);pointer-events:auto;font-size:1em}
.start-hint button{background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-edge);border-radius:6px;padding:.45em 1em;box-shadow:3px 3px 0 rgba(20,28,44,.4);font-weight:700}
.vn{display:none;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:76px}
.vn canvas{width:40px;height:auto;aspect-ratio:16/22;image-rendering:pixelated;flex:none;background:var(--sunk);border-radius:6px}
.vn .t{min-width:0}
.vn .n{font-weight:700;font-size:13px}
.vn .x{margin-top:2px}
.vn.ai .x{font-family:var(--mono);color:var(--glow)}
.vn.narr .x{font-style:italic;color:var(--muted)}
@media (max-width:640px){.overlay .bubble,.overlay .caption{display:none}.vn{display:flex}}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--pen)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink);font-weight:700}
.btn.small{padding:4px 10px;font-size:13px}
.ctl-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl-group label{font-size:12px;color:var(--muted)}
.seed{width:6.5em;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums}
.status{font-size:13px;color:var(--muted);margin-left:auto;min-width:0}
.status.warn{color:var(--bad)}

/* rail */
.rail{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 32px);min-height:420px}
@media (max-width:1000px){.rail{max-height:none}}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--pen);font-weight:700}
.pane{overflow:auto;padding:12px 14px;flex:1;min-height:0}
.pane[hidden]{display:none}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px}
.log .sec{margin-top:8px;font-family:var(--pixel);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;display:flex;gap:8px;align-items:center}
.log .sec::after{content:"";flex:1;height:1px;background:var(--line)}
.log .stg{font-size:12px;color:var(--muted);margin-top:4px}
.log .ln b{font-weight:700;margin-right:.35em}
.log .ln.hr b{color:var(--hr)} .log .ln.biz b{color:var(--biz)} .log .ln.cand b{color:var(--cand)}
.log .ln.ai{font-family:var(--mono);font-size:12px;color:var(--glow);border-left:2px solid var(--glow);padding-left:8px}
.log .ln.narr{font-style:italic;color:var(--narr)}
.log .ln.judge{background:var(--sunk);border-radius:8px;padding:6px 8px}
.empty{color:var(--muted);font-size:13px}
.aud{display:flex;flex-direction:column;gap:10px}
.acard{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.acard.hired{border-color:var(--folder);box-shadow:inset 0 0 0 1px var(--folder)}
.acard .hd{display:flex;gap:8px;align-items:center}
.acard .hd canvas{width:30px;height:auto;aspect-ratio:16/22;image-rendering:pixelated;background:var(--sunk);border-radius:5px}
.acard .hd .nm{font-weight:700}
.acard .hd .tag{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.chip.ai{border-color:var(--glow);color:var(--glow)}
.chip.good{border-color:var(--good);color:var(--good)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.hire{background:var(--folder);border-color:var(--folder);color:var(--folder-ink);font-weight:700}
.scores{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.scores b{font-family:var(--pixel);font-size:13px;color:var(--ink);font-weight:400}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) 2.2em;gap:2px 8px;align-items:center;font-size:11px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--pen)}
.bar.ai i{background:var(--glow)} .bar.ex i{background:var(--cand)} .bar.ho i{background:var(--good)} .bar.ne i{background:var(--bad)}
.bars .v{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
table.mx{border-collapse:collapse;width:100%;font-size:12px}
.mx th,.mx td{border:1px solid var(--line);padding:5px 4px;text-align:center;font-variant-numeric:tabular-nums}
.mx th:first-child,.mx td:first-child{text-align:left}
.mx td.hot{background:color-mix(in srgb,var(--folder) 35%,transparent)}
.tablebox{overflow-x:auto}
.runs{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:12px}
.run{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.run .meta{color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}

/* casting */
.casting{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.casting h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;letter-spacing:.04em}
.casting h3{font-size:13px;margin:0;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.casting h3 span{font-family:var(--pixel);font-size:11px;letter-spacing:.06em}
.crow{display:flex;flex-direction:column;gap:8px}
.job{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.job input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 10px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.on{border-color:var(--pen);background:color-mix(in srgb,var(--pen) 7%,var(--panel));box-shadow:inset 0 0 0 1px var(--pen)}
.card .row{display:flex;gap:8px;align-items:center;min-width:0}
.card canvas{width:30px;height:auto;aspect-ratio:16/22;image-rendering:pixelated;flex:none;background:var(--panel);border-radius:5px}
.card .nm{font-weight:700;line-height:1.25}
.card .tg{font-size:11px;color:var(--muted)}
.card .ds{font-size:12px;color:var(--muted);line-height:1.45}
.card .code{font-family:var(--pixel);font-size:18px;color:var(--pen);line-height:1;width:1.4em}
.card .edit{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--muted);font-size:12px;padding:2px 4px}
.card .edit:hover{color:var(--pen)}
.card.add{align-items:center;justify-content:center;border-style:dashed;color:var(--pen);min-height:88px;font-weight:700;background:transparent}
.seats{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.seat{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.seat select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 6px;max-width:100%}
.seat .rowx{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.att{font-size:11px;color:var(--muted)}

/* editor */
.editor{position:fixed;inset:0;z-index:30;background:rgba(10,14,22,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.ed{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);padding:16px;display:flex;flex-direction:column;gap:12px}
.ed h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.ed .gen{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px}
.ed textarea,.ed input[type=text],.ed select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px}
.ed textarea{min-height:64px;resize:vertical}
.ed .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.ed .f label{font-size:12px;color:var(--muted)}
.ed .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.ed .sl{display:grid;grid-template-columns:5.5em minmax(0,1fr) 2.4em;gap:8px;align-items:center;font-size:12px}
.ed .sl output{font-variant-numeric:tabular-nums;text-align:right}
.ed .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ed .err{color:var(--bad);font-size:12px;min-height:1em}
.stagelist{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stagelist .chip{display:inline-flex;gap:4px;align-items:center;font-size:12px;padding:2px 4px 2px 9px}
.stagelist .chip button{border:0;background:none;color:var(--muted);padding:0 4px}
.ed .preview{display:flex;gap:10px;align-items:center}
.ed .preview canvas{width:48px;height:60px;image-rendering:pixelated;background:var(--sunk);border-radius:6px}
.card .pick{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;color:inherit;width:100%;min-width:0}
.card .pick:focus-visible{outline:2px solid var(--pen);outline-offset:4px;border-radius:6px}
.seat canvas{width:30px;height:auto;aspect-ratio:16/22;image-rendering:pixelated;background:var(--panel);border-radius:5px;flex:none}
.seat .nm{font-weight:700}
.seat .ds{font-size:12px;color:var(--muted)}
.seat .who{min-width:0}
.seat .hd{justify-content:space-between}
[inert]{opacity:.55}
.hire .x{position:absolute;top:2px;right:6px;border:0;background:none;color:#4A5873;font-size:1.1em;padding:2px 4px}
.bx{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.bx h4{margin:0;font-size:14px}
.bx .rowx{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bx select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px}
.prog{height:6px;border-radius:3px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--glow);transition:width .3s}
.mx small{display:block;color:var(--muted);font-size:10.5px;line-height:1.3}
@media (prefers-reduced-motion: reduce){.bubble,.caption,.skip{transition:none}}
</style>

<header class="top">
  <div class="brand">
    <h1>未来面试间<small>FALL 2030</small></h1>
    <p>2030 年秋招的一间面试室。选好候选人、面试官和面试方式，按下开始，看谁会被录用。你能看到面试官看不到的东西：谁用了 AI，谁没发现陷阱，谁在隐瞒。</p>
  </div>
  <div class="mode">
    <div class="seg" role="group" aria-label="台词来源">
      <button id="modeLive" type="button" aria-pressed="false" disabled>Claude 生成</button>
      <button id="modeDemo" type="button" aria-pressed="true">演示模式</button>
    </div>
    <div class="hint" id="modeHint">正在连接 Claude…</div>
  </div>
</header>

<main class="app">
  <section class="theater" aria-label="面试现场">
    <div class="stage-wrap" id="stageWrap">
      <canvas id="stage" width="320" height="180" aria-label="像素风面试室：左边是候场走廊，右边是面试间"></canvas>
      <div class="overlay" id="overlay">
        <div class="poster" aria-hidden="true"><b>2030</b>秋季招聘<br>数据岗</div>
        <div class="wb" id="wb"><span class="code" id="wbCode">B</span><span class="name" id="wbName">开卷实战</span><span class="step" id="wbStep">等待开始</span></div>
        <div class="caption" id="caption"></div>
        <div class="skip" id="skip">十五分钟后</div>
        <div class="start-hint" id="startHint"><button type="button" id="startHintBtn">开始面试</button></div>
      </div>
    </div>

/* ---------- the mechanism: code decides how well each step goes ---------- */
function levelOf(q){
  if(q>=80)return{key:'top',tier:'hi',label:'出色',hint:'答得清楚具体，有自己的见解'};
  if(q>=65)return{key:'good',tier:'hi',label:'良好',hint:'基本正确，细节略少'};
  if(q>=50)return{key:'mid',tier:'mid',label:'一般',hint:'方向对，但讲不清细节'};
  if(q>=35)return{key:'weak',tier:'lo',label:'较弱',hint:'有明显漏洞，被问住时含糊其辞'};
  return{key:'poor',tier:'lo',label:'很差',hint:'答不上来，或者答错'};
}
function planInterview(c,fmt,seed){
  const r=rng(hashStr(seed+'|'+c.id+'|'+c.name+'|'+fmt.id));
  const {knowledge:K,ai:A,expression:E,honesty:Hn,nerves:N}=c.ab;
  const nerv=-0.12*(N-30), jitter=a=>(r()*2-1)*a;
  const plan={cand:c,fmt,stages:[],usedAI:false,trapFound:null,concealed:false};
  let kq=0,fq=0;
  fmt.stages.forEach((type,idx)=>{
    const T=STAGE_TYPES[type];const st={i:idx+1,type,label:T.label,by:T.by,usedAI:false};let q=50;
    if(type==='intro')q=0.55*E+0.2*K+0.25*(100-N)+jitter(6);
    else if(type==='knowledge'){st.n=kq++;q=0.8*K+0.2*E+nerv+jitter(8);}
    else if(type==='task'||type==='trap'){
      const use=fmt.ai&&(A>=45||r()<A/100);st.usedAI=use;if(use)plan.usedAI=true;
      q=(use?0.5*A+0.3*K+0.2*E+8:0.8*K+0.2*E-4)+nerv*0.5+jitter(6);
      if(type==='trap'){const p=use?sig((K-62)/8):sig((K-50)/8);st.trapFound=r()<p;plan.trapFound=st.trapFound;q=st.trapFound?Math.max(q,70)+4:Math.min(q,46);}
    }
    else if(type==='followup'){st.n=fq++;st.shaky=plan.usedAI&&K<55;q=0.8*K+0.2*E+nerv-(st.shaky?12:0)+jitter(8);}
    else if(type==='behavior'){st.n=hashStr(c.id+seed)%2;q=0.6*E+0.2*(100-N)+0.2*Hn+jitter(8);}
    else if(type==='disclosure'){st.disclose=!plan.usedAI?'none':(r()<Hn/100?'honest':'hide');if(st.disclose==='hide')plan.concealed=true;q=st.disclose==='hide'?0.5*E+10:0.5*E+0.3*Hn;}
    else if(type==='closing')q=0.5*E+0.3*K+0.2*(100-N)+jitter(6);
    st.q=Math.round(clamp(q));st.level=levelOf(st.q);plan.stages.push(st);
  });
  return plan;
}

function demoScript(plan,ctx){

  if(extra){const s=document.createElement('span');s.className='score';s.textContent=extra;tx.after(s);}
  el.classList.add('on');const a=kind==='say'?actors[key==='cand'?curCandKey:key]:null;if(a)a.talk=true;
  const look=key==='cand'?(actors[curCandKey]||{}).look:(actors[key]||{}).look;
  vnSet(kind,name,kind==='ai'?null:look,'');
  try{await typeOut(s=>{tx.textContent=s;vn.text.textContent=s+(extra?'  '+extra:'');},text,tok);if(a)a.talk=false;await wait(hold(text),tok);}
  finally{if(a)a.talk=false;el.classList.remove('on');const s=el.querySelector('.score');if(s)s.remove();}
}
async function narrate(text,tok,lines){const cap=$('#caption');cap.innerHTML='<b>旁白</b>'+esc(text);cap.classList.add('on');vnSet('narr','旁白',null,text);logLine('narr','旁白',text);if(lines)lines.push({who:'narr',name:'旁白',say:text});
  try{await wait(1500+text.length*55,tok);}finally{cap.classList.remove('on');}}
async function walkTo(a,x,tok,pxPerSec=46){a.pose='walk';a.dir=x>=a.x?1:-1;let last=performance.now();
  while(Math.abs(a.x-x)>.5){await frame();check(tok);const now=performance.now(),dt=now-last;last=now;if(state.paused)continue;const step=pxPerSec*dt/1000*speedMul();if(reduced||state.speed>=12){a.x=x;break;}a.x+=Math.sign(x-a.x)*Math.min(step,Math.abs(x-a.x));}
  a.x=x;}
async function moveY(a,y,tok,ms=320){const y0=a.y,t0=performance.now();let el=0,last=t0;while(el<ms){await frame();check(tok);const now=performance.now();if(!state.paused)el+=(now-last)*speedMul();last=now;a.y=y0+(y-y0)*Math.min(1,el/ms);}a.y=y;}
async function timeSkip(st,tok){const sk=$('#skip');sk.textContent='十五分钟后';sk.classList.add('on');const a=actors[curCandKey];if(a){a.typing=true;a.glow=!!st.usedAI;}
  try{for(let k=0;k<15;k++){simMin++;await wait(70,tok);}await wait(500,tok);}finally{sk.classList.remove('on');if(a){a.typing=false;a.glow=false;}}}
async function withThinking(keys,p,tok){keys.forEach(k=>setEmote(actors[k],'dots',1e9));let done=false,val;p.then(v=>{done=true;val=v;},()=>{done=true;});
  try{while(!done){await frame();check(tok);}}finally{keys.forEach(k=>clearEmote(actors[k]));}return val;}

function handleClaudeError(e,what){const code=(e&&e.code)||'upstream_error';if(code==='cancelled')return;state.fellBack=true;
  if(HIDE.has(code)){state.sample=null;state.mode='demo';updateModeUI();flash(errText(code)+'，已切换到演示模式。',true);return;}

function busy(){return state.running||batch.active;}
function startScript(plan,ctx){
  const S={beats:[],done:false,waiters:[],onDone:[],ctl:new AbortController()};state.scripts.add(S);
  const wake=()=>S.waiters.splice(0).forEach(f=>f());
  const push=bt=>{S.beats.push(bt);wake();};
  const finish=()=>{S.done=true;wake();S.onDone.splice(0).forEach(f=>f());state.scripts.delete(S);};
  if(live()){state.ctls.add(S.ctl);
    liveScript(plan,ctx,push,S.ctl.signal).then(n=>{if(n<2)throw{code:'empty_completion'};})
      .catch(e=>{if(e&&e.code==='cancelled')return;handleClaudeError(e,'台词');const cov=S.beats.reduce((m,x)=>Math.max(m,x.s),0);demoScript(plan,ctx).filter(x=>x.s>cov).forEach(push);})
      .finally(()=>{state.ctls.delete(S.ctl);finish();});
  }else{demoScript(plan,ctx).forEach(push);finish();}
  return S;}
async function waitBeat(S,tok){const a=actors[curCandKey];setEmote(a,'dots',1e9);setStatus('Claude 正在写台词…');let woke=false;S.waiters.push(()=>{woke=true;});
  try{while(!woke&&!S.done){await frame();check(tok);}}finally{clearEmote(a);setStatus(runStatus);}}
async function playScript(plan,S,ctx,tok){
  const lines=[];let idx=0,cur=0;const stg=s=>plan.stages[s-1];
  const enter=async s=>{while(cur<s&&cur<plan.stages.length){if(cur>0){const ne=narrEnd(stg(cur),plan);if(ne)await narrate(ne,tok,lines);}
    cur++;const st=stg(cur);st.played=true;setBoard(ctx.fmt,`第 ${st.i} 步 · ${st.label}`);logStage(st);audRefresh();const ns=narrStart(st,plan,ctx);if(ns)await narrate(ns,tok,lines);}};
  for(;;){
    if(idx<S.beats.length){const bt=S.beats[idx++];if(bt.s>cur)await enter(bt.s);await playBeat(bt,plan,stg(Math.max(cur,1)),ctx,tok,lines);}
    else if(S.done)break;else await waitBeat(S,tok);
  }
  await enter(plan.stages.length);const last=stg(cur);if(last){const ne=narrEnd(last,plan);if(ne)await narrate(ne,tok,lines);}
  return lines;}
async function playBeat(bt,plan,st,ctx,tok,lines){
  const a=actors[curCandKey];const name=bt.who==='hr'?ctx.hr.name:bt.who==='biz'?ctx.biz.name:bt.who==='cand'?plan.cand.name:'AI 工具';
  if(st&&(st.type==='task'||st.type==='trap')&&(bt.who==='cand'||bt.who==='ai')&&!st._skip){st._skip=true;await timeSkip(st,tok);}
  const sp=bt.who==='ai'||bt.who==='cand'?a:actors[bt.who];
  if(bt.who==='ai'&&a){a.glow=true;a.typing=true;}
  try{
    if(bt.act==='type'&&bt.who==='cand'&&a){a.typing=true;if(st&&st.usedAI)a.glow=true;await wait(800,tok);a.typing=false;a.glow=false;}
    if(bt.act==='think'&&bt.who!=='ai'){setEmote(sp,'dots',1e9);await wait(650,tok);clearEmote(sp);}
    if(bt.act==='nervous'&&bt.who!=='ai')setEmote(sp,'sweat',1e9);
    if(bt.act==='surprised'&&bt.who!=='ai')setEmote(sp,'!',1700);
    logLine(bt.who,name,bt.say);lines.push({who:bt.who,name,say:bt.say});
    await speak(bt.who,name,bt.say,bt.who==='ai'?'ai':'say',tok);
    if(bt.act==='smile'&&sp&&bt.who!=='ai')sp.smileUntil=performance.now()+1600;
  }finally{if(a){a.glow=false;a.typing=false;}if(bt.act==='nervous'&&sp)clearEmote(sp);}
  simMin++;}

async function startRun(){
  if(busy())return;const ctx=makeCtx();const cands=sel.cands.map(id=>byId(allCands(),id));
  state.running=true;state.paused=false;state.fellBack=false;const tok=++state.token;

  const plans=cands.map(c=>planInterview(c,ctx.fmt,ctx.seed));const results=[];view={plans,results,dec:null};audRefresh();
  try{
    setBoard(ctx.fmt,'即将开始');await wait(400,tok);

    for(let i=0;i<plans.length;i++){
      const plan=plans[i],a=actors['c'+i];curCandKey='c'+i;runStatus=`第 ${i+1}/${plans.length} 位候选人：${plan.cand.name}`;setStatus(runStatus);
      logSection(`${plan.cand.name} · ${plan.cand.arche}`);
      if(i+1<plans.length){const S=scripts[i],kick=()=>{if(!scripts[i+1]&&tok===state.token)scripts[i+1]=startScript(plans[i+1],ctx);};if(S.done)kick();else S.onDone.push(kick);}

    else{const k=dec.hire,a=actors['c'+k],c=results[k].plan.cand;a.done=false;a.pose='stand';await moveY(a,WALK_Y,tok,220);await walkTo(a,176,tok);a.pose='stand';a.dir=1;a.smileUntil=performance.now()+1e9;
      burst(184,118);showHire(c,dec.reason);logLine('narr','结果',`录用${c.name}。${dec.reason}`);}
    setBoard(ctx.fmt,dec.hire==null?'无人录用':'录用 '+results[dec.hire].plan.cand.name);
    record(ctx,results,dec,state.fellBack?'mixed':(ctx.mode==='live'?'claude':'demo'));audRefresh();

}

function chipsFor(plan){const out=[];for(const st of plan.stages){if(!st.played)continue;

const NAME_POOL=['赵晨','孙一凡','李沐','钱多多','吴越','郑可','王小川','冯思','刘一鸣','何安','高原','罗素素','梁卓','宋知','唐果','韩宇','曹悦','邓林','许诺','谢天','苏木','叶青','白露','江河'];
function variantsOf(cands,seed){const r=rng(hashStr('v'+seed)),used=new Set();return cands.map(c=>{let nm,guard=0;do{nm=NAME_POOL[Math.floor(r()*NAME_POOL.length)];}while(used.has(nm)&&guard++<50);used.add(nm);
  const j=v=>Math.round(clamp(v+(r()*2-1)*8));return Object.assign({},c,{id:c.id+'~'+seed,baseId:c.id,name:nm,ab:{knowledge:j(c.ab.knowledge),ai:j(c.ab.ai),expression:j(c.ab.expression),honesty:j(c.ab.honesty),nerves:j(c.ab.nerves)}});});}
function wilson(k,n){if(!n)return[0,0];const z=1.96,p=k/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return[Math.max(0,c-h),Math.min(1,c+h)];}
function matrixHTML(recs,withScores){const codes=[...new Set(recs.map(r=>r.fmt.code))].sort();const names={};recs.forEach(r=>names[r.fmt.code]=r.fmt.name);
  const arches=[...new Set(recs.flatMap(r=>r.cands.map(c=>c.arche)))];const cell={},rounds={};
  recs.forEach(r=>{rounds[r.fmt.code]=(rounds[r.fmt.code]||0)+1;r.cands.forEach(c=>{const k=c.arche+'|'+r.fmt.code;const x=cell[k]||(cell[k]={n:0,h:0,hr:0,biz:0});x.n++;x.hr+=c.hr;x.biz+=c.biz;});
    if(r.hired){const x=cell[r.hired.arche+'|'+r.fmt.code];if(x)x.h++;}});
  const best={};codes.forEach(cd=>{let m=-1;arches.forEach(a=>{const x=cell[a+'|'+cd];if(x&&x.h/x.n>m)m=x.h/x.n;});best[cd]=m;});
  return `<div class="tablebox"><table class="mx"><thead><tr><th>候选人类型</th>${codes.map(cd=>`<th>${esc(cd)} ${esc(names[cd])}<small>${rounds[cd]} 轮</small></th>`).join('')}</tr></thead><tbody>`+
    arches.map(a=>`<tr><td>${esc(a)}</td>${codes.map(cd=>{const x=cell[a+'|'+cd];if(!x)return '<td>–</td>';const p=x.h/x.n,[lo,hi]=wilson(x.h,x.n);
      return `<td class="${p>0&&p===best[cd]?'hot':''}">${Math.round(p*100)}%<small>${x.h}/${x.n}</small><small>${Math.round(lo*100)}–${Math.round(hi*100)}%</small>${withScores?`<small>${Math.round(x.hr/x.n)} / ${Math.round(x.biz/x.n)}</small>`:''}</td>`;}).join('')}</tr>`).join('')+'</tbody></table></div><p class="note">每格从上到下：录用率；录用次数/面试次数；95% 置信区间'+(withScores?'；HR / 业务面试官给这类人的平均分':'')+'。高亮的是这种面试方式下录用率最高的类型。</p>';}
function ruleEstimate(rounds=200){validSel();const base=makeCtx();const cands=sel.cands.map(id=>byId(allCands(),id));const fmts=PRESET_FMTS.concat(base.fmt.custom?[base.fmt]:[]);const recs=[];
  for(const f of fmts){const ctx=Object.assign({},base,{fmt:f,mode:'demo'});for(let s=1;s<=rounds;s++){const vs=variantsOf(cands,s*7919+13);
    const res=vs.map(v=>{const plan=planInterview(v,f,s);return{plan,judge:demoJudge(plan,ctx)};});const d=demoDeliberate(res,ctx);
    recs.push({fmt:{code:f.code,name:f.name},cands:res.map(r=>({arche:r.plan.cand.arche,hr:r.judge.hr.score,biz:r.judge.biz.score})),hired:d.hire==null?null:{arche:res[d.hire].plan.cand.arche}});}}

async function runBatch(){
  if(busy()||!live())return;const base=makeCtx();const cands=sel.cands.map(id=>byId(allCands(),id));
  const rounds=Number(($('#bRounds')||{}).value)||3;const fmts=(($('#bFmts')||{}).value==='all')?PRESET_FMTS:[base.fmt];
  Object.assign(batch,{active:true,stop:false,done:0,total:rounds*fmts.length,msg:'准备中…'});updateRunUI();renderResults();
  const seed0=(parseInt($('#seed').value,10)||2030)*100;
  try{
    outer:for(const f of fmts)for(let r=0;r<rounds;r++){if(batch.stop)break outer;
      const ctx=Object.assign({},base,{fmt:f,seed:seed0+r,mode:'live'});const vs=variantsOf(cands,ctx.seed);const results=[];
      for(const v of vs){if(batch.stop)break outer;batch.msg=`${f.code} ${f.name} · 第 ${r+1}/${rounds} 轮 · 正在面试 ${v.name}（${v.arche}）`;renderBatchUI();
        const plan=planInterview(v,f,ctx.seed);const beats=[];batch.ctl=new AbortController();
        const n=await liveScript(plan,ctx,bt=>beats.push(bt),batch.ctl.signal);if(n<2)throw{code:'empty_completion'};
        const lines=beats.map(bt=>({who:bt.who,name:bt.who==='hr'?ctx.hr.name:bt.who==='biz'?ctx.biz.name:bt.who==='cand'?v.name:'AI 工具',say:bt.say}));
        batch.ctl=new AbortController();results.push({plan,judge:await liveJudge(plan,ctx,lines,batch.ctl.signal)});}
      batch.msg=`${f.code} ${f.name} · 第 ${r+1}/${rounds} 轮 · 面试官在讨论`;renderBatchUI();
      batch.ctl=new AbortController();const dec=await liveDeliberate(results,ctx,batch.ctl.signal);
      batch.done++;record(ctx,results,dec,'claude-batch');}
    batch.msg=batch.stop?`已停止，完成了 ${batch.done} 轮。`:`完成了 ${batch.done} 轮，结果已计入下面的统计。`;
  }catch(e){const code=e&&e.code;batch.msg=code==='cancelled'?`已停止，完成了 ${batch.done} 轮。`:`第 ${batch.done+1} 轮中断：${errText(code)}。已完成的 ${batch.done} 轮已经记下。`;
    if(HIDE.has(code)){state.sample=null;state.mode='demo';updateModeUI();}}
  finally{batch.active=false;batch.ctl=null;updateRunUI();renderResults();}}
function stopBatch(){batch.stop=true;if(batch.ctl)try{batch.ctl.abort()}catch{}}
function renderBatchUI(){const m=$('#bMsg'),pr=$('#bProg');if(m)m.textContent=batch.msg;if(pr)pr.style.width=(batch.total?Math.round(batch.done/batch.total*100):0)+'%';}
function batchCalls(){const r=Number(($('#bRounds')||{}).value)||3,f=(($('#bFmts')||{}).value==='all')?4:1,n=sel.cands.length;return r*f*(2*n+1);}

      ${batch.active?'<button class="btn small" id="bStop" type="button">停止批量</button>':`<button class="btn small primary" id="bGo" type="button" ${busy()||state.mode!=='live'?'disabled':''}>开始批量</button>`}</div>

      <div class="prog"><i id="bProg" style="width:0%"></i></div><div class="att" id="bMsg"></div>`:'<p class="note" style="margin:0">需要在 claude.ai 里打开这个页面才能用。下面的规则估算随时可以跑。</p>'}</div>

     <div class="confirm" style="margin-top:8px">${confirmClear?'<span>确定清空全部记录？</span><button class="btn small" id="clrYes" type="button">清空</button><button class="btn small" id="clrNo" type="button">取消</button>':'<button class="btn small" id="clr" type="button">清空记录</button>'}</div>`:'<p class="empty">还没有记录。</p>'}

  const on=(id,f)=>{const x=$('#'+id);if(x)x.onclick=f;};

    ${state.sample?`<div class="gen"><label for="edDesc">用一句话描述，让 Claude 帮你填好下面的表</label><textarea id="edDesc" placeholder="${esc(ph)}"></textarea><div class="acts" style="justify-content:flex-start;align-items:center"><button class="btn primary small" id="edGen" type="button">让 Claude 设计</button><span class="att" id="edGenMsg"></span></div></div>`:'<p class="note" style="margin:0">现在需要手动填写。在 claude.ai 里打开这个页面，就可以用一句话让 Claude 来设计。</p>'}
    <div id="edFields"></div><div class="err" id="edErr"></div>
    <div class="acts">${item&&item.custom?'<button class="btn" id="edDel" type="button">删除</button>':''}<button class="btn" id="edCancel" type="button">取消</button><button class="btn primary" id="edSave" type="button">保存</button></div>`;
  paintFields();edWrap.hidden=false;
  const gen=$('#edGen');if(gen)gen.onclick=async()=>{const d=str($('#edDesc').value,200);const msg=$('#edGenMsg');if(!d){msg.textContent='先写一句描述。';return;}
    gen.disabled=true;msg.textContent='Claude 正在设计…';
    try{const o=await state.sample.json(GEN[kind](d,sel.job),{modelTier:'quick',cache:false});const keep=edState.it.id;
      const n=kind==='cand'?normCand(Object.assign({},o,{arche:edState.it.arche||'自定义'})):kind==='int'?normInt(o):normFmt(o);n.id=keep;edState.it=n;paintFields();msg.textContent='填好了，可以再手动调整。';}
    catch(e){msg.textContent=errText(e&&e.code)+'。';if(e&&HIDE.has(e.code)){state.sample=null;state.mode='demo';updateModeUI();}}
    finally{gen.disabled=false;}};
  $('#edCancel').onclick=closeEditor;
  $('#edSave').onclick=()=>{const {kind,it,orig}=edState;if(!str(it.name,10)){$('#edErr').textContent='请给它起个名字。';return;}
    const list=store.customs[kind];const editing=orig&&orig.custom;const norm=(kind==='cand'?normCand:kind==='int'?normInt:normFmt)(Object.assign({},it,editing?{}:{id:undefined}));
    if(editing){norm.id=orig.id;const i=list.findIndex(x=>x.id===orig.id);if(i>=0)list[i]=norm;else list.push(norm);}else list.push(norm);
    if(kind==='cand'){if(!sel.cands.includes(norm.id)){if(sel.cands.length>=5)sel.cands.pop();sel.cands.push(norm.id);}}
    else if(kind==='int')sel[norm.role]=norm.id;else sel.fmt=norm.id;
    save();closeEditor();castingChanged();flash(`已保存“${norm.name}”。`);};
  const del=$('#edDel');if(del)del.onclick=()=>{if(!edState.del){edState.del=true;del.textContent='再点一次确认删除';return;}
    const {kind,orig}=edState;store.customs[kind]=store.customs[kind].filter(x=>x.id!==orig.id);sel.cands=sel.cands.filter(id=>id!==orig.id);save();closeEditor();castingChanged();};
  setTimeout(()=>{const f=$('#edDesc')||$('#edName');if(f)f.focus();},0);}
function closeEditor(){edWrap.hidden=true;ed.innerHTML='';edState=null;if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch{}}
edWrap.addEventListener('click',e=>{if(e.target===edWrap)closeEditor();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!edWrap.hidden)closeEditor();});

/* ---------- controls, mode, tabs ---------- */
function updateModeUI(){const L=$('#modeLive'),D=$('#modeDemo');L.disabled=!state.sample||busy();D.disabled=busy();
  L.setAttribute('aria-pressed',String(state.mode==='live'));D.setAttribute('aria-pressed',String(state.mode==='demo'));
  $('#modeHint').textContent=!state.claudeKnown?'正在连接 Claude…':state.sample?(state.mode==='live'?'台词和评价由 Claude 实时生成，用的是你自己的 Claude 额度。第一次开始时会请你授权。':'演示模式：台词来自写好的模板，评价用固定公式，不调用 Claude。'):'演示模式：台词来自写好的模板。在 claude.ai 里打开这个页面，就能让 Claude 生成台词。';}
function updateRunUI(){const b=busy();$('#btnStart').disabled=b;$('#startHintBtn').disabled=b;$('#btnPause').disabled=!state.running;$('#btnStop').disabled=!state.running;
  if(!state.running)$('#btnPause').textContent='暂停';$('.casting').inert=b;const bg=$('#bGo');if(bg)bg.disabled=b||state.mode!=='live';updateModeUI();}
$('#modeLive').onclick=()=>{if(state.sample&&!busy()){state.mode='live';updateModeUI();renderResults();}};
$('#modeDemo').onclick=()=>{if(!busy()){state.mode='demo';updateModeUI();renderResults();}};
$('#btnStart').onclick=startRun;$('#startHintBtn').onclick=startRun;$('#btnPause').onclick=togglePause;$('#btnStop').onclick=stopRun;
$('#btnDice').onclick=()=>{$('#seed').value=String(1000+Math.floor(Math.random()*9000));};
$$('#speed button').forEach(bn=>bn.onclick=()=>{state.speed=Number(bn.dataset.speed);$$('#speed button').forEach(x=>x.setAttribute('aria-pressed',String(x===bn)));});
const TABS=[['tabLog','paneLog'],['tabAud','paneAud'],['tabRes','paneRes']];
TABS.forEach(([t,p])=>$('#'+t).onclick=()=>{TABS.forEach(([t2,p2])=>{$('#'+t2).setAttribute('aria-selected',String(t2===t));$('#'+p2).hidden=t2!==t;});if(p==='paneLog')scrollLog();});
async function initClaude(){let s=null;try{if(window.claude&&typeof window.claude.use==='function')s=await window.claude.use('sample');}catch{s=null;}
  state.claudeKnown=true;state.sample=s||null;if(state.sample&&!busy())state.mode='live';updateModeUI();renderResults();}

/* ---------- boot ---------- */
buildBackground();buildForeground();validSel();$('#job').value=sel.job;renderCasting();resetStage();audRefresh();renderResults();updateRunUI();
requestAnimationFrame(loop);initClaude();
})();
</script>
